name: Segnali 4 ore
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */4 * * *'
permissions:
  contents: write
concurrency:
  group: segnali
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node backtest/segnali.mjs
      - run: |
          git config user.name "sentinella-bot"
          git config user.email "bot@users.noreply.github.com"
          git add risultati/segnali.json
          git commit -m "Segnali 4 ore" || echo nulla
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
