name: Ottimizzazione automatica
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'    # ogni giorno, mattina (06:17 in Italia d'inverno)
    - cron: '17 17 * * *'   # ogni giorno, sera (18:17)
permissions:
  contents: write
concurrency:
  group: ottimizzazione
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --max-old-space-size=6000 backtest/run.mjs
      - run: node --max-old-space-size=6000 backtest/run2.mjs
      - run: node backtest/luna.mjs
      - run: python3 backtest/dati_futures.py
        continue-on-error: true
      - run: node --max-old-space-size=6000 backtest/run3.mjs
        continue-on-error: true
      - run: node backtest/segnali.mjs
        continue-on-error: true
      - run: pip install --quiet openpyxl && python3 backtest/excel.py
      - run: |
          git config user.name "sentinella-bot"
          git config user.email "bot@users.noreply.github.com"
          git add risultati
          git commit -m "Ottimizzazione automatica: risultati aggiornati" || echo "niente da salvare"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin main && break; sleep 6; done
