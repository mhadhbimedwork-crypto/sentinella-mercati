name: Test vendite e macro
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node backtest/macro.mjs
      - run: node --max-old-space-size=6000 backtest/test5.mjs
      - run: |
          git config user.name "sentinella-bot"
          git config user.email "bot@users.noreply.github.com"
          git add risultati
          git commit -m "Test vendite in regime ribassista e quadro macro" || echo nulla
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin main && break; sleep 6; done
