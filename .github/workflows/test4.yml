name: Test order flow
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --max-old-space-size=6000 backtest/test4.mjs | tee out4.txt
      - run: |
          git config user.name "sentinella-bot"
          git config user.email "bot@users.noreply.github.com"
          git add risultati/test4_orderflow.json
          git commit -m "Test order flow" || echo nulla
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
