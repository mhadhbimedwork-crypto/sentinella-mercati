name: Test costi exchange
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backtest/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: COSTI=exchange node --max-old-space-size=6000 backtest/run2.mjs
      - run: |
          git config user.name "sentinella-bot"
          git config user.email "bot@users.noreply.github.com"
          git add risultati/backtest2_exchange.json
          git commit -m "Test costi exchange" || echo nulla
          git pull --rebase origin main
          git push origin main
