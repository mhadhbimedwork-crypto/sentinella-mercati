name: APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Costruisci l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Pubblica l'APK nella release "apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SentinellaMercati.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk SentinellaMercati.apk --title "Sentinella Mercati - APK Android" --latest \
            --notes "Installa una volta sola: l'app carica la versione online e si aggiorna da sola. Build ${{ github.run_number }}."
